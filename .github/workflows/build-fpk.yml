name: Build Wild Work FPK (custom)

# 手动触发：推 tag v* 到本仓库 → 自动构建 peng418/wild-work 定制版并发布 Release
# workflow_dispatch：手动触发（可指定版本），仅出 artifact

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 v2.4.3）'
        required: true
        default: 'v2.4.3'
      upstream_ref:
        description: 'git ref（tag/branch，默认 version）'
        required: false
        default: ''

jobs:
  build-fpk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout FPK repo
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Install Pillow (for icon resize)
        run: |
          pip3 install Pillow 2>/dev/null || apt-get update -qq && apt-get install -y -qq python3-pil

      - name: Resolve version and upstream ref
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            # tag 触发: 去掉 v 前缀作为版本号
            TAG="${{ github.ref_name }}"
            VERSION="${TAG#v}"
            # 先从定制 fork 试，没有则用上游
            UPSTREAM_REF="$TAG"
            echo "tag 触发：TAG=$TAG VERSION=$VERSION"
          else
            # workflow_dispatch
            VERSION="${{ github.event.inputs.version }}"
            VERSION="${VERSION#v}"
            UPSTREAM="${INPUTS_UPSTREAM:-${{ github.event.inputs.version }}}"
            echo "dispatch 触发：VERSION=$VERSION"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "upstream_ref=$UPSTREAM_REF" >> "$GITHUB_OUTPUT"

      - name: Build wild-work binary from peng418/wild-work
        id: build-bin
        run: |
          VERSION="${{ steps.resolve.outputs.version }}"
          UPSTREAM_REF="${{ steps.resolve.outputs.upstream_ref }}"

          # 优先从定制 fork 检出
          SRC_REPO="peng418/wild-work"
          echo "尝试从 ${SRC_REPO} 检出 ${UPSTREAM_REF}..."
          if git ls-remote --exit-code --tags "https://github.com/${SRC_REPO}.git" "${UPSTREAM_REF}" 2>/dev/null; then
            echo "✓ 从定制 fork ${UPSTREAM_REF} 构建"
            git clone --depth 1 --branch "${UPSTREAM_REF}" "https://github.com/${SRC_REPO}.git" /tmp/wild-work-src
          else
            # fork 没有该 tag → 从上游 rockswang 取
            echo "⚠ 定制 fork 无 ${UPSTREAM_REF}，回退到 rockswang/wild-work"
            SRC_REPO="rockswang/wild-work"
            git clone --depth 1 --branch "${UPSTREAM_REF}" "https://github.com/${SRC_REPO}.git" /tmp/wild-work-src 2>/dev/null || \
              git clone --depth 1 "https://github.com/${SRC_REPO}.git" /tmp/wild-work-src && \
              (cd /tmp/wild-work-src && git fetch origin "${UPSTREAM_REF}" && git checkout "${UPSTREAM_REF}")
          fi

          cd /tmp/wild-work-src
          go mod download
          go build -o /tmp/wild-work -ldflags='-s -w' ./cmd/wild-work
          echo "Binary built: $(file /tmp/wild-work)"
          echo "Size: $(stat -c%s /tmp/wild-work) B"
          echo "SHA: $(sha256sum /tmp/wild-work | cut -d' ' -f1)"

      - name: Build FPK package
        run: |
          # 替换 payload
          cp /tmp/wild-work "${{ github.workspace }}/payload/wild-work"
          chmod 755 "${{ github.workspace }}/payload/wild-work"

          # 运行打包脚本
          VERSION="${{ steps.resolve.outputs.version }}"
          chmod +x build-fpk.sh
          bash build-fpk.sh "$VERSION" /tmp/fpk-out

          echo "FPK built:"
          ls -la /tmp/fpk-out/

      - name: Upload FPK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wildwork-fpk
          path: /tmp/fpk-out/wildwork-*.fpk
          retention-days: 30

      - name: Create GitHub Release (tag push only)
        uses: softprops/action-gh-release@v1
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        with:
          files: /tmp/fpk-out/wildwork-*.fpk
          generate_release_notes: true
          draft: false
          prerelease: false